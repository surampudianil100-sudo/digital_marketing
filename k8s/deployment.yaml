apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-marketing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-marketing
  template:
    metadata:
      labels:
        app: digital-marketing
    spec:
      containers:
        - name: digital-marketing
          image: 699038657587.dkr.ecr.ap-south-1.amazonaws.com/devsecops-app:v1
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
